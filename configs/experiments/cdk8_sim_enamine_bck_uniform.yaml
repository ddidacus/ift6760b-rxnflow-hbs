# CDK8 similarity on Enamine-290k, frozen uniform P_B over the one-step candidates.
# The control: separates learning P_B from dropping the recursive search.
env_dir: ./data/envs/enamine_290k/

reward:
  beta: "32"
  settings:
    target: cdk8

subsampling:
  sampling_ratio: 0.1
  min_sampling: 50
  importance_temp: 1.0

property_penalty:
  mw: 500

backward:
  mode: learned
  objective: none

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ift6760"
version = "0.1.0"
description = "Learned backward policies for synthesis-aware GFlowNets (built on RxnFlow v2.1.1)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26.4", "torch>=2.1", "omegaconf>=2.3", "tqdm", "rdkit>=2023.9.6", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3"]
prepare = ["druglikeness>=0.2.2"]  # only for building new environments with a druglikeness filter

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]
# `ruff format` wraps code; long comments, docstrings and strings are allowed.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["IFT6760"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["slow: integration tests that run training steps (deselect with -m 'not slow')"]
